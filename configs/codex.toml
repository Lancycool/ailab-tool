[mcp_servers.campus-runner]
command = "C:/path/to/ailab-tool/.venv/Scripts/python.exe"
args = ["-X", "utf8", "-m", "campus_runner.cli", "--home", "C:/path/to/ailab-tool/.campus-runner", "--port", "8765", "mcp"]
startup_timeout_sec = 15
tool_timeout_sec = 60
enabled = true

[mcp_servers.campus-runner.env]
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"
