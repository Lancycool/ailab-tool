- insert:
    - id: campus-runner-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: campus-runner
        transport: stdio
        command: "C:/path/to/ailab-tool/.venv/Scripts/python.exe"
        args: ["-X", "utf8", "-m", "campus_runner.cli", "--home", "C:/path/to/ailab-tool/.campus-runner", "--port", "8765", "mcp"]
        env: {"PYTHONUTF8": "1", "PYTHONIOENCODING": "utf-8"}
        toolCallTimeoutMs: 60000
